  <rect x="9"  y="6"  width="5" height="32" fill="#1a6b5a"/>
  <rect x="18" y="10" width="5" height="24" fill="#1a6b5a"/>
  <rect x="27" y="6"  width="5" height="32" fill="#1a6b5a"/>
  <rect x="36" y="14" width="5" height="18" fill="#1a6b5a"/>
  <!-- Divider -->
  <line x1="50" y1="6" x2="50" y2="38" stroke="#e2e2de" stroke-width="1"/>
  <!-- Wordmark -->
  <text x="60" y="29" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="400" fill="#17171a" letter-spacing="0.2">Tacticity</text>
